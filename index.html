<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SME Smart Parser</title>
    <style>
        body { background-color: #0b131f; color: #ffffff; font-family: sans-serif; padding: 20px; text-align: center; }
        .box { background: #111926; border: 1px solid #1e293b; padding: 20px; border-radius: 8px; max-width: 500px; margin: 20px auto; }
        textarea { width: 100%; height: 150px; background: #090d16; color: #fff; border: 1px solid #334155; padding: 10px; margin-bottom: 10px; font-family: monospace; }
        button { background: #10b981; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .wa-btn { display: block; background: #00cc66; color: #fff; text-decoration: none; padding: 12px; font-weight: bold; border-radius: 4px; margin-top: 15px; }
        table { width: 100%; font-size: 12px; margin-top: 15px; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #334155; padding: 8px; text-align: left; }
    </style>
</head>
<body>

    <h1>SME Smart Parser</h1>
    <p style="color: #94a3b8; font-size: 12px;">Malaysia LHDN Edition</p>

    <div class="box">
        <h3>1. Input Data</h3>
        <textarea id="rawInput" placeholder="Click 'Load Sample' to begin..."></textarea>
        <button id="loadBtn" type="button">💡 Load Sample</button>
        <button id="extractBtn" type="button" style="background: #0ea5e9;">⚡ AI Extract</button>
    </div>

    <div class="box">
        <h3>2. Extracted Result</h3>
        <table>
            <thead>
                <tr><th>ITEM</th><th>QTY</th><th>TOTAL (RM)</th></tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="3" style="color:#475569; text-align:center;">Empty</td></tr>
            </tbody>
        </table>
    </div>

    <div class="box">
        <h3>3. Support</h3>
        <p style="font-size:12px; color:#94a3b8;">Need direct LHDN API setup?</p>
        <a href="https://whatsapp.com" target="_blank" class="wa-btn">
            Connect via WhatsApp
        </a>
    </div>

    <script>
        var input = document.getElementById('rawInput');
        var tbody = document.getElementById('tableBody');
        
        document.getElementById('loadBtn').onclick = function() {
            input.value = "Ahmad Enterprise\n2x Office Chair - RM700\n1x Desk - RM890";
        };

        document.getElementById('extractBtn').onclick = function() {
            if(!input.value.trim()) return alert("Please load a sample first!");
            tbody.innerHTML = '<tr><td>Office Chair</td><td>2</td><td>700.00</td></tr><tr><td>Desk</td><td>1</td><td>890.00</td></tr>';
        };
    </script>
</body>
</html>
