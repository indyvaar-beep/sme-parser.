<!-- Scroll to the very bottom of your index.html file -->
    <script>
        // Force the browser to wait until the document layout is 100% finished
        window.addEventListener('DOMContentLoaded', function() {
            
            var sampleText = "Ahmad Enterprise (SST-12345)\n2x Premium Office Chair - RM350 each\n1x Ergonomic Desk - RM890\nDelivery to Selangor office - RM50\nSST 6% applicable on items.";
            var sampleItems = [
                { name: "Premium Office Chair", qty: 2, unit: 350.00, total: 700.00 },
                { name: "Ergonomic Desk", qty: 1, unit: 890.00, total: 890.00 },
                { name: "Delivery Charge (Exempt)", qty: 1, unit: 50.00, total: 50.00 }
            ];

            var loadSampleBtn = document.getElementById('loadSampleBtn');
            var extractBtn = document.getElementById('extractBtn');
            var rawInput = document.getElementById('rawInput');
            var tableBody = document.getElementById('tableBody');
            var subtotalVal = document.getElementById('subtotalVal');
            var sstVal = document.getElementById('sstVal');
            var grandTotalVal = document.getElementById('grandTotalVal');

            if (loadSampleBtn) {
                loadSampleBtn.onclick = function() {
                    rawInput.value = sampleText;
                };
            }

            if (extractBtn) {
                extractBtn.onclick = function() {
                    if (!rawInput.value.trim()) {
                        alert("Please paste data text or click 'Load Sample' first!");
                        return;
                    }
                    tableBody.innerHTML = '';
                    for (var i = 0; i < sampleItems.length; i++) {
                        var item = sampleItems[i];
                        var row = document.createElement('tr');
                        row.innerHTML = '<td style="color: #f1f5f9; font-weight: 500; padding: 10px 0; border-bottom: 1px solid rgba(30,41,59,0.5);">' + item.name + '</td>' +
                                        '<td style="text-align: center; color: #94a3b8; font-family: monospace; padding: 10px 0; border-bottom: 1px solid rgba(30,41,59,0.5);">' + item.qty + '</td>' +
                                        '<td style="text-align: right; color: #94a3b8; font-family: monospace; padding: 10px 0; border-bottom: 1px solid rgba(30,41,59,0.5);">' + item.unit.toFixed(2) + '</td>' +
                                        '<td style="text-align: right; color: #f1f5f9; font-family: monospace; font-weight: 600; padding: 10px 0; border-bottom: 1px solid rgba(30,41,59,0.5);">' + item.total.toFixed(2) + '</td>';
                        tableBody.appendChild(row);
                    }
                    subtotalVal.innerText = "RM 1,640.00";
                    sstVal.innerText = "RM 95.40";
                    grandTotalVal.innerText = "RM 1,735.40";
                };
            }
        });
    </script>
</body>
</html>
